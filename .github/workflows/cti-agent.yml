name: CTI Agent
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4
      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installera beroenden
        run: pip install feedparser requests beautifulsoup4
      - name: Kör agenten
        run: python3 agent.py
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
      - name: Committa uppdaterad databas
        run: |
          git config user.name "CTI Agent Bot"
          git config user.email "actions@github.com"
          if [ -f cti.db ]; then
            git add cti.db index.html
            git diff --staged --quiet || git commit -m "Uppdatera IOC-databas"
            git push origin HEAD:${{ github.ref_name }}
          fi
