name: CTI agent

on:
  schedule:
    - cron: "7 * * * *"   # varje timme, minut 07
  workflow_dispatch:       # gör att du kan köra manuellt via Actions-fliken

permissions:
  contents: write          # behövs för att agenten ska kunna committa cti.db, index.html och exports/

concurrency:
  group: cti-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install feedparser requests beautifulsoup4

      - name: Kör agenten
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELKS_USER: ${{ secrets.ELKS_USER }}
          ELKS_PASS: ${{ secrets.ELKS_PASS }}
          SMS_TO: ${{ secrets.SMS_TO }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python agent.py

      - name: Committa resultat
        run: |
          git config user.name "cti-agent"
          git config user.email "cti-agent@users.noreply.github.com"
          git add cti.db index.html exports
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa"
          else
            git commit -m "CTI-uppdatering $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs || true
            git push
          fi
